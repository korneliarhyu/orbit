name: orbit
description: "AI Social Universe - ChatApp"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

# ==========================================
# DEPENDENCIES
# ==========================================
dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.0
  firebase_storage: ^14.0.1

  # Local Storage
  shared_preferences: ^2.5.6

  # Media
  image_picker: ^1.2.4

  # Device Configuration
  device_info_plus: ^13.3.0

  # Icons
  cupertino_icons: ^2.0.0

# ==========================================
# DEVELOPMENT DEPENDENCIES
# ==========================================
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# ==========================================
# FLUTTER CONFIGURATION
# ==========================================
flutter:
  uses-material-design: true

  assets:
    - lib/core/assets/
    - lib/core/assets/npc/